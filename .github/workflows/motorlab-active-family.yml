name: MotorLab permanent active source & Scudo inheritance
on:
  push:
    branches: [main, 'lab/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: motorlab-active-source-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require correct project family and native Scudo workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/motorlab-active-guard.mjs --self-test
          node scripts/motorlab-active-guard.mjs
      - name: Advance control-only main reference after verified guard
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REF="$(node -p "require('./.motorlab/active-family.json').active_ref")"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$REF" -f "sha=$GITHUB_SHA" -F "force=false" --jq '.object.sha'
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$REF" --jq '.object.sha')" = "$GITHUB_SHA"
          echo "[MOTORLAB_CONTROL_ACTIVE_REF_ADVANCED] $REF $GITHUB_SHA"
