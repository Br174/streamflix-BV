name: Temporary MusicLab LAB build

on:
  push:
    branches:
      - musiclab-build-temp

permissions:
  contents: read

jobs:
  build:
    if: github.event.head_commit.message == 'prepare MusicLab build runner raw'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout build harness
        uses: actions/checkout@v6

      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/musiclab_private.pem 2>/dev/null
          openssl pkey -in /tmp/musiclab_private.pem -pubout -out /tmp/musiclab_public.pem

      - name: Publish one-time public key
        uses: actions/upload-artifact@v6
        with:
          name: musiclab-build-public-key
          path: /tmp/musiclab_public.pem
          retention-days: 1

      - name: Wait for encrypted manifest
        shell: bash
        run: |
          set -euo pipefail
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}/musiclab_manifest_payload.txt"
          found=0
          for n in $(seq 1 180); do
            code=$(curl -sS -L -o /tmp/payload.b64 -w '%{http_code}' "$RAW" || true)
            if [ "$code" = "200" ]; then found=1; break; fi
            sleep 5
          done
          [ "$found" = "1" ] || { echo 'Encrypted manifest not received'; exit 1; }
          tr -d '\r\n' < /tmp/payload.b64 | base64 -d > /tmp/musiclab_bundle.tgz
          mkdir -p /tmp/musiclab_payload
          tar -xzf /tmp/musiclab_bundle.tgz -C /tmp/musiclab_payload

      - name: Decrypt manifest
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey /tmp/musiclab_private.pem \
            -in /tmp/musiclab_payload/wrapped_key.bin \
            -out /tmp/musiclab_payload/aes.pass \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/musiclab_payload/manifest.enc \
            -out /tmp/musiclab_manifest.tsv \
            -pass file:/tmp/musiclab_payload/aes.pass
          rm -f /tmp/musiclab_payload/aes.pass /tmp/musiclab_private.pem

      - name: Prepare exact Meld base
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/FrancescoGrazioso/Meld.git /tmp/MusicLab
          cd /tmp/MusicLab
          git checkout --quiet c33e6faa8364a7fbf0ea3f1fa3503c679a425f0b
          git submodule update --init --quiet metroproto

      - name: Materialize private LAB changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1" out="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$out"
          }
          while IFS=$'\t' read -r kind path sha expected; do
            [ -n "${kind:-}" ] || continue
            case "$kind" in
              FILE)
                mkdir -p "/tmp/MusicLab/$(dirname "$path")"
                fetch_blob "$sha" "/tmp/MusicLab/$path"
                actual=$(cd /tmp/MusicLab && git hash-object "$path")
                [ "$actual" = "$sha" ] || { echo "Blob verification failed for $path"; exit 1; }
                ;;
              PATCH)
                fetch_blob "$sha" /tmp/player_hunks.patch
                python3 "$GITHUB_WORKSPACE/.github/scripts/apply_musiclab_hunks.py" "/tmp/MusicLab/$path" /tmp/player_hunks.patch
                actual=$(cd /tmp/MusicLab && git hash-object "$path")
                [ "$actual" = "$expected" ] || { echo "Patched-file verification failed for $path: $actual != $expected"; exit 1; }
                ;;
              CHUNK_START)
                mkdir -p "/tmp/MusicLab/$(dirname "$path")"
                fetch_blob "$sha" /tmp/musiclab_chunk.part
                cat /tmp/musiclab_chunk.part > "/tmp/MusicLab/$path"
                ;;
              CHUNK_APPEND)
                fetch_blob "$sha" /tmp/musiclab_chunk.part
                cat /tmp/musiclab_chunk.part >> "/tmp/MusicLab/$path"
                ;;
              VERIFY)
                actual=$(cd /tmp/MusicLab && git hash-object "$path")
                if [ "$actual" != "$sha" ]; then
                  printf '\n' >> "/tmp/MusicLab/$path"
                  actual=$(cd /tmp/MusicLab && git hash-object "$path")
                fi
                [ "$actual" = "$sha" ] || { echo "Reconstructed-file verification failed for $path: $actual != $sha"; exit 1; }
                ;;
              *) echo "Unknown manifest record: $kind"; exit 1 ;;
            esac
          done < /tmp/musiclab_manifest.tsv
          rm -f /tmp/musiclab_manifest.tsv /tmp/player_hunks.patch /tmp/musiclab_chunk.part
          cd /tmp/MusicLab
          echo "MusicLab LAB source materialized successfully."
          git diff --stat

      - name: Wire cover long-press standard menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/MusicLab/app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt')
          s = p.read_text(encoding='utf-8')
          marker = '        onDismiss = { showCoverSearchDialog = false },\n'
          replacement = marker + '        navController = navController,\n'
          if replacement not in s:
              if marker not in s:
                  raise SystemExit('CoverSearchDialog wiring point not found')
              s = s.replace(marker, replacement, 1)
              p.write_text(s, encoding='utf-8')
          print('Cover result long-press wired to standard MusicLab song menu')
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Install protoc and generate sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp/MusicLab/app
          bash generate_proto.sh

      - name: Build installable APK
        shell: bash
        env:
          METROLIST_APPLICATION_ID: it.verlezza.musiclab.lab37c644e
          METROLIST_APP_NAME: MusicLab LAB
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: workflow_dispatch
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
          CRASH_REPORT_TOKEN: ''
          CRASH_REPORT_REPO: ''
        run: |
          set -euo pipefail
          cd /tmp/MusicLab
          chmod +x gradlew
          ./gradlew --console=plain assembleFossDebug --warning-mode summary -x lint
          apk=$(find app/build/outputs/apk/foss/debug -type f -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo 'APK not found'; exit 1; }
          cp "$apk" /tmp/MusicLab-LAB-37c644e.apk
          sha256sum /tmp/MusicLab-LAB-37c644e.apk | tee /tmp/MusicLab-LAB-37c644e.sha256
          cd /tmp
          zip -q MusicLab-LAB-37c644e-APK.zip MusicLab-LAB-37c644e.apk MusicLab-LAB-37c644e.sha256

      - name: Upload APK and APK ZIP
        uses: actions/upload-artifact@v6
        with:
          name: MusicLab-LAB-37c644e
          path: |
            /tmp/MusicLab-LAB-37c644e.apk
            /tmp/MusicLab-LAB-37c644e.sha256
            /tmp/MusicLab-LAB-37c644e-APK.zip
          retention-days: 1
