name: Temporary MusicLab LAB build

on:
  push:
    branches:
      - musiclab-build-temp

permissions:
  contents: read

jobs:
  build:
    if: github.event.head_commit.message == 'prepare MusicLab build runner v3'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/musiclab_private.pem 2>/dev/null
          openssl pkey -in /tmp/musiclab_private.pem -pubout -out /tmp/musiclab_public.pem

      - name: Publish one-time public key
        uses: actions/upload-artifact@v6
        with:
          name: musiclab-build-public-key
          path: /tmp/musiclab_public.pem
          retention-days: 1

      - name: Wait for encrypted manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/musiclab_manifest_payload.txt?ref=${GITHUB_REF_NAME}"
          found=0
          for n in $(seq 1 180); do
            code=$(curl -sS -L -o /tmp/payload.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" || true)
            if [ "$code" = "200" ]; then found=1; break; fi
            sleep 5
          done
          [ "$found" = "1" ] || { echo 'Encrypted manifest not received'; exit 1; }
          jq -r '.content' /tmp/payload.json | tr -d '\n' | base64 -d > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/musiclab_bundle.tgz
          mkdir -p /tmp/musiclab_payload
          tar -xzf /tmp/musiclab_bundle.tgz -C /tmp/musiclab_payload

      - name: Decrypt manifest
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey /tmp/musiclab_private.pem \
            -in /tmp/musiclab_payload/wrapped_key.bin \
            -out /tmp/musiclab_payload/aes.pass \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/musiclab_payload/manifest.enc \
            -out /tmp/musiclab_manifest.tsv \
            -pass file:/tmp/musiclab_payload/aes.pass
          rm -f /tmp/musiclab_payload/aes.pass /tmp/musiclab_private.pem

      - name: Prepare exact Meld base
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/FrancescoGrazioso/Meld.git /tmp/MusicLab
          cd /tmp/MusicLab
          git checkout --quiet c33e6faa8364a7fbf0ea3f1fa3503c679a425f0b
          git submodule update --init --quiet metroproto

      - name: Materialize private LAB changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          fetch_blob() {
            local sha="$1" out="$2"
            curl -fsSL \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' | tr -d '\n' | base64 -d > "$out"
          }
          while IFS=$'\t' read -r kind path sha expected; do
            [ -n "${kind:-}" ] || continue
            case "$kind" in
              FILE)
                mkdir -p "/tmp/MusicLab/$(dirname "$path")"
                fetch_blob "$sha" "/tmp/MusicLab/$path"
                actual=$(cd /tmp/MusicLab && git hash-object "$path")
                [ "$actual" = "$sha" ] || { echo "Blob verification failed for $path"; exit 1; }
                ;;
              PATCH)
                fetch_blob "$sha" /tmp/player_hunks.patch
                python3 - "$path" /tmp/player_hunks.patch <<'PY'
import sys
from pathlib import Path

target = Path('/tmp/MusicLab') / sys.argv[1]
patch_path = Path(sys.argv[2])
text = target.read_text(encoding='utf-8')
had_newline = text.endswith('\n')
lines = text.splitlines()
patch_lines = patch_path.read_text(encoding='utf-8').splitlines()

hunks = []
current = None
for line in patch_lines:
    if line.startswith('@@'):
        if current is not None:
            hunks.append(current)
        current = []
    elif current is not None and line[:1] in {' ', '+', '-'}:
        current.append(line)
if current is not None:
    hunks.append(current)

def find_subseq(haystack, needle):
    if not needle:
        return None
    limit = len(haystack) - len(needle) + 1
    for i in range(max(0, limit)):
        if haystack[i:i+len(needle)] == needle:
            return i
    return None

for number, hunk in enumerate(hunks, 1):
    old = [line[1:] for line in hunk if line[:1] in {' ', '-'}]
    new = [line[1:] for line in hunk if line[:1] in {' ', '+'}]
    pos = find_subseq(lines, old)
    if pos is None:
        raise SystemExit(f'Could not locate PlayerMenu hunk {number}')
    lines[pos:pos+len(old)] = new

result = '\n'.join(lines) + ('\n' if had_newline else '')
target.write_text(result, encoding='utf-8')
print(f'Applied {len(hunks)} PlayerMenu hunks')
PY
                actual=$(cd /tmp/MusicLab && git hash-object "$path")
                [ "$actual" = "$expected" ] || { echo "Patched-file verification failed for $path: $actual != $expected"; exit 1; }
                ;;
              *) echo "Unknown manifest record: $kind"; exit 1 ;;
            esac
          done < /tmp/musiclab_manifest.tsv
          rm -f /tmp/musiclab_manifest.tsv /tmp/player_hunks.patch
          cd /tmp/MusicLab
          echo "MusicLab LAB source materialized successfully."
          git diff --stat

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true

      - name: Install protoc and generate sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp/MusicLab/app
          bash generate_proto.sh

      - name: Build installable APK
        shell: bash
        env:
          METROLIST_APPLICATION_ID: it.verlezza.musiclab.lab820a7bf
          METROLIST_APP_NAME: MusicLab LAB
          PULL_REQUEST: 'false'
          GITHUB_EVENT_NAME: workflow_dispatch
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
          CRASH_REPORT_TOKEN: ''
          CRASH_REPORT_REPO: ''
        run: |
          set -euo pipefail
          cd /tmp/MusicLab
          chmod +x gradlew
          ./gradlew --console=plain assembleFossDebug --warning-mode summary -x lint
          apk=$(find app/build/outputs/apk/foss/debug -type f -name '*.apk' | head -1)
          [ -n "$apk" ] || { echo 'APK not found'; exit 1; }
          cp "$apk" /tmp/MusicLab-LAB-820a7bf.apk
          sha256sum /tmp/MusicLab-LAB-820a7bf.apk | tee /tmp/MusicLab-LAB-820a7bf.sha256
          cd /tmp
          zip -q MusicLab-LAB-820a7bf-APK.zip MusicLab-LAB-820a7bf.apk MusicLab-LAB-820a7bf.sha256

      - name: Upload APK and APK ZIP
        uses: actions/upload-artifact@v6
        with:
          name: MusicLab-LAB-820a7bf
          path: |
            /tmp/MusicLab-LAB-820a7bf.apk
            /tmp/MusicLab-LAB-820a7bf.sha256
            /tmp/MusicLab-LAB-820a7bf-APK.zip
          retention-days: 1
