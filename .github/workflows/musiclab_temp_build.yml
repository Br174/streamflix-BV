name: Temporary MusicLab encrypted build v4

on:
  push:
    branches:
      - musiclab-temp-build-20260922
    paths:
      - .github/workflows/musiclab_temp_build.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/musiclab_private.pem 2>/dev/null
          openssl pkey -in /tmp/musiclab_private.pem -pubout -out /tmp/musiclab_public.pem

      - name: Publish one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: musiclab-build-public-key-v4
          path: /tmp/musiclab_public.pem
          retention-days: 1

      - name: Wait for encrypted MusicLab manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/musiclab_payload_v4.enc.txt?ref=${GITHUB_REF_NAME}"
          found=0
          for n in $(seq 1 180); do
            code=$(curl -sS -L -o /tmp/payload.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$API" || true)
            if [ "$code" = "200" ]; then
              found=1
              break
            fi
            sleep 2
          done
          [ "$found" = "1" ] || { echo 'Encrypted payload not received'; exit 1; }
          jq -r '.content' /tmp/payload.json | tr -d '\n' | base64 -d > /tmp/payload_text.b64
          base64 -d /tmp/payload_text.b64 > /tmp/musiclab_outer.tgz
          mkdir -p /tmp/musiclab_crypto
          tar -xzf /tmp/musiclab_outer.tgz -C /tmp/musiclab_crypto

      - name: Decrypt private materialization script
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt \
            -inkey /tmp/musiclab_private.pem \
            -in /tmp/musiclab_crypto/wrapped_key.bin \
            -out /tmp/musiclab_crypto/aes.pass \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in /tmp/musiclab_crypto/materialize.enc \
            -out /tmp/materialize_musiclab.sh \
            -pass file:/tmp/musiclab_crypto/aes.pass
          rm -f /tmp/musiclab_crypto/aes.pass
          chmod 700 /tmp/materialize_musiclab.sh

      - name: Prepare exact Meld base and materialize MusicLab LAB
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/FrancescoGrazioso/Meld.git /tmp/MusicLab
          cd /tmp/MusicLab
          git checkout --quiet c33e6faa8364a7fbf0ea3f1fa3503c679a425f0b
          git submodule update --init --quiet metroproto
          /tmp/materialize_musiclab.sh /tmp/MusicLab
          rm -f /tmp/materialize_musiclab.sh

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install protoc and generate sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp/MusicLab/app
          bash generate_proto.sh >/tmp/proto.log 2>&1 || { tail -80 /tmp/proto.log; exit 1; }

      - name: Generate isolated LAB signing key
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MusicLab
          keytool -genkeypair -noprompt \
            -keystore app/persistent-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname 'CN=MusicLab LAB,O=MusicLab,C=IT' >/dev/null 2>&1

      - name: Build MusicLab LAB APK
        env:
          METROLIST_APPLICATION_ID: com.meld.app.musiclablab
          METROLIST_APP_NAME: MusicLab LAB
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MusicLab
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleFossDebug --warning-mode summary >/tmp/musiclab_build.log 2>&1 || {
            echo 'Gradle build failed. Showing final diagnostic lines only:'
            tail -180 /tmp/musiclab_build.log
            exit 1
          }
          mkdir -p /tmp/musiclab_out
          APK=$(find app/build/outputs/apk/foss/debug -type f -name '*.apk' | head -1)
          [ -n "$APK" ]
          cp "$APK" /tmp/musiclab_out/MusicLab-LAB.apk
          cd /tmp/musiclab_out
          zip -q -9 MusicLab-LAB-APK.zip MusicLab-LAB.apk
          sha256sum MusicLab-LAB.apk MusicLab-LAB-APK.zip

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-final-v4
          path: |
            /tmp/musiclab_out/MusicLab-LAB.apk
            /tmp/musiclab_out/MusicLab-LAB-APK.zip
          retention-days: 1
