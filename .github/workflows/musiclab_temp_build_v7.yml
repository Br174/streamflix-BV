name: MusicLab encrypted source build v7

on:
  push:
    branches:
      - musiclab-temp-build-20260922
    paths:
      - .github/workflows/musiclab_temp_build_v7.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Generate one-time encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out /tmp/musiclab_private.pem 2>/dev/null
          openssl pkey -in /tmp/musiclab_private.pem -pubout -out /tmp/musiclab_public.pem

      - name: Publish one-time public key
        uses: actions/upload-artifact@v4
        with:
          name: musiclab-build-public-key-v7
          path: /tmp/musiclab_public.pem
          retention-days: 1

      - name: Wait for encrypted source chunks
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 600); do
            ok=1
            for p in 1 2 3 4; do
              API="https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/musiclab_payload_v7.part${p}?ref=${GITHUB_REF_NAME}"
              code=$(curl -sS -L -o "/tmp/part${p}.json" -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$API" || true)
              [ "$code" = "200" ] || ok=0
            done
            [ "$ok" = "1" ] && break
            sleep 2
          done
          [ "$ok" = "1" ] || { echo 'Encrypted payload chunks not received'; exit 1; }
          : > /tmp/payload_text.b64
          for p in 1 2 3 4; do
            jq -r '.content' "/tmp/part${p}.json" | tr -d '\n' | base64 -d >> /tmp/payload_text.b64
          done
          base64 -d /tmp/payload_text.b64 > /tmp/musiclab_outer.tgz
          mkdir -p /tmp/musiclab_crypto
          tar -xzf /tmp/musiclab_outer.tgz -C /tmp/musiclab_crypto

      - name: Decrypt source overlay
        shell: bash
        run: |
          set -euo pipefail
          openssl pkeyutl -decrypt -inkey /tmp/musiclab_private.pem -in /tmp/musiclab_crypto/wrapped_key.bin -out /tmp/musiclab_crypto/aes.pass -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
          openssl enc -d -aes-256-cbc -pbkdf2 -in /tmp/musiclab_crypto/payload.enc -out /tmp/musiclab_source_bundle.tgz -pass file:/tmp/musiclab_crypto/aes.pass
          rm -f /tmp/musiclab_crypto/aes.pass
          mkdir -p /tmp/musiclab_overlay
          tar -xzf /tmp/musiclab_source_bundle.tgz -C /tmp/musiclab_overlay

      - name: Prepare exact MusicLab LAB source
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/FrancescoGrazioso/Meld.git /tmp/MusicLab
          cd /tmp/MusicLab
          git checkout --quiet c33e6faa8364a7fbf0ea3f1fa3503c679a425f0b
          git submodule update --init --quiet metroproto
          cp -a /tmp/musiclab_overlay/app/. /tmp/MusicLab/app/
          git apply --check /tmp/musiclab_overlay/PlayerMenu.patch
          git apply --whitespace=nowarn /tmp/musiclab_overlay/PlayerMenu.patch
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/CoverChronology.kt)" = 6435081f1e6b210dc59045d62a07115b76fd8c42
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/CoverConfidence.kt)" = c10f8e19a6aa2f6e025374afb568cf848a974e42
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/CoverSearchDialog.kt)" = fac9e65d3da77bea790d60bfc6d946a4e63f81e8
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/CoverWebVerification.kt)" = b7a678dc1aff9d904acbe508ae7005fa5bd3cc63
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/CoverYearResolver.kt)" = 91d891cd1cae3a8ff849463ce8c1e28192104706
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/GeminiCoverVerification.kt)" = 5bce5ef01deb8936c8e5f39e2f8d780ae516d81e
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/MusicBrainzCoverSource.kt)" = 2dc9ba3823df985989b53b9ae48a2fe5892618cf
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/component/WhoSampledCoverSource.kt)" = 9b4bb18651315788476fe6f036510624e87e96e0
          test "$(git hash-object app/src/main/res/values/musiclab_strings.xml)" = 5e452fa908931cb09b1f1667f4c83ad91c11c363
          test "$(git hash-object app/src/main/res/values-it/musiclab_strings.xml)" = 11f87e3b6235f9d428c5f9f9fbd22ea2432f2c3d
          test "$(git hash-object app/src/main/kotlin/com/metrolist/music/ui/menu/PlayerMenu.kt)" = 0deca35920c7c59089cd7562676a86fd293838d5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Install protoc and generate sources
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v34.0/protoc-34.0-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d "$HOME/.local"
          chmod +x "$HOME/.local/bin/protoc"
          export PATH="$HOME/.local/bin:$PATH"
          cd /tmp/MusicLab/app
          bash generate_proto.sh >/tmp/proto.log 2>&1 || { tail -80 /tmp/proto.log; exit 1; }

      - name: Generate LAB signing key
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MusicLab
          rm -f app/persistent-debug.keystore
          keytool -genkeypair -noprompt -keystore app/persistent-debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=MusicLab LAB,O=MusicLab,C=IT' >/dev/null 2>&1

      - name: Build MusicLab LAB APK
        env:
          METROLIST_APPLICATION_ID: com.meld.app.musiclablab
          METROLIST_APP_NAME: MusicLab LAB
          LASTFM_API_KEY: ''
          LASTFM_SECRET: ''
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/MusicLab
          chmod +x gradlew
          ./gradlew --no-daemon --console=plain :app:assembleFossDebug --warning-mode summary >/tmp/musiclab_build.log 2>&1 || { echo 'Gradle build failed:'; tail -220 /tmp/musiclab_build.log; exit 1; }
          mkdir -p /tmp/musiclab_out
          APK=$(find app/build/outputs/apk/foss/debug -type f -name '*.apk' | head -1)
          [ -n "$APK" ]
          cp "$APK" /tmp/musiclab_out/MusicLab-LAB.apk
          cd /tmp/musiclab_out
          zip -q -9 MusicLab-LAB-APK.zip MusicLab-LAB.apk
          sha256sum MusicLab-LAB.apk MusicLab-LAB-APK.zip

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MusicLab-LAB-final-v7
          path: |
            /tmp/musiclab_out/MusicLab-LAB.apk
            /tmp/musiclab_out/MusicLab-LAB-APK.zip
          retention-days: 1
