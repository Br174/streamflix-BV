name: Publish verified Verlezza Vision TV

on:
  push:
    branches: [main]
    paths:
      - release-manifest.json
      - scripts/verify_verlezza_release.py
      # Editing the publisher itself must never trigger a production publication.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-verlezza-vision-tv
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Br174/streamflix-BV'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: MotorLab permanent active source proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/motorlab-active-guard.mjs --self-test
          node scripts/motorlab-active-guard.mjs

      - name: Setup Scudo360 test runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Scudo360 signed release policy JUnit gate
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json promotion .motorlab/scudo360-report.json
      - name: Scudo360 Quality r40 mandatory release before-after check
        env:
          SCUDO360_R40_PROMOTION: '1'
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-report.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-r40-quality.json
      - name: Preserve release test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scudo360-streambv-${{ github.run_id }}
          path: |
            .motorlab/scudo360-report.json
            .motorlab/scudo360-test-results/*.xml
          if-no-files-found: warn

      - name: Validate release manifest
        run: python3 scripts/verify_verlezza_release.py prepare release-manifest.json

      - name: Retrieve and check the TV installer
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 "$VV_ARCHIVE_URL" --output installer.zip
          python3 scripts/verify_verlezza_release.py extract release-manifest.json installer.zip
          sha256sum --check SHA256SUMS.txt

      - name: Verify signature, version, app name and TV launcher
        shell: bash
        run: |
          set -euo pipefail
          VV_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$VV_BUILD_TOOLS/apksigner" verify --verbose --print-certs Visionflix_BV_TV.apk > signature-info.txt
          "$VV_BUILD_TOOLS/aapt" dump badging Visionflix_BV_TV.apk > apk-info.txt
          python3 scripts/verify_verlezza_release.py verify release-manifest.json apk-info.txt signature-info.txt

      - name: Prevent publication over a newer version
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" > latest-release.json
          python3 scripts/verify_verlezza_release.py release-state release-manifest.json latest-release.json

      - name: Publish verified APK for Downloader 3875230
        if: env.VV_RELEASE_ACTION != 'superseded'
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VV_RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$VV_RELEASE_TAG" --repo "$GH_REPO" --pattern Visionflix_BV_TV.apk --dir existing
            cmp Visionflix_BV_TV.apk existing/Visionflix_BV_TV.apk
            if [ "$VV_RELEASE_ACTION" = "publish" ]; then
              gh release edit "$VV_RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
            fi
          else
            cat > release-notes.md <<EOF
          Verlezza Vision TV ${VV_VERSION_NAME} (build ${VV_VERSION_CODE}).

          Codice Downloader: **3875230**.
          Il nome del file resta Visionflix_BV_TV.apk per conservare il collegamento stabile.

          Verificati integrità, firma, versione, nome e launcher TV. La prova sul dispositivo finale resta da effettuare.
          Firma stabile dalla build 168: le precedenti build con chiavi temporanee diverse non sono aggiornabili direttamente. Prima di rimuovere la vecchia app, salvare dati e impostazioni.
          EOF
            gh release create "$VV_RELEASE_TAG" \
              Visionflix_BV_TV.apk SHA256SUMS.txt apk-info.txt signature-info.txt release-manifest.json \
              --repo "$GH_REPO" --target "$GITHUB_SHA" \
              --title "Verlezza Vision TV — ${VV_VERSION_NAME} (build ${VV_VERSION_CODE})" \
              --notes-file release-notes.md --draft
            gh release edit "$VV_RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
          fi

      - name: Verify the anonymous stable download
        if: env.VV_RELEASE_ACTION != 'superseded'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 120 \
            'https://github.com/Br174/streamflix-BV/releases/latest/download/Visionflix_BV_TV.apk' \
            --output public-download.apk
          echo "$VV_APK_SHA256  public-download.apk" | sha256sum --check -
          echo "Verlezza Vision ${VV_VERSION_NAME}: download pubblico verificato, codice 3875230." >> "$GITHUB_STEP_SUMMARY"
