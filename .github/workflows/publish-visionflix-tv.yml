name: Publish Verlezza Vision TV installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-visionflix-tv.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-verlezza-vision-tv
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Br174/streamflix-BV'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: verlezza-tv-169
      APK_SHA256: 5a41c52bdc5c19c7ae00be223ae5e55b6a024ebb1d1d78df035219188aa46b3a
    steps:
      - name: Retrieve and verify the existing TV build
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --max-time 120 \
            'https://d2ol7oe51mr4n9.cloudfront.net/user_3E6GjrEqyb1drjFxT0lzAQlYkuB/c5dc6251-3010-4891-a40c-9418fce524e3.zip' \
            --output installer.zip
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          with zipfile.ZipFile("installer.zip") as archive:
              if archive.namelist() != ["Visionflix_BV_TV.apk"]:
                  raise SystemExit("Unexpected archive contents")
              data = archive.read("Visionflix_BV_TV.apk")
          if hashlib.sha256(data).hexdigest() != os.environ["APK_SHA256"]:
              raise SystemExit("APK checksum mismatch")
          pathlib.Path("Visionflix_BV_TV.apk").write_bytes(data)
          PY
          printf '%s  Visionflix_BV_TV.apk\n' "$APK_SHA256" > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Verify Android signature and TV entry point
        shell: bash
        run: |
          set -euo pipefail
          VF_BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$VF_BUILD_TOOLS/apksigner" verify --verbose --print-certs Visionflix_BV_TV.apk | tee signature-info.txt
          VV_CERTIFICATES="$(sed -n 's/^.*certificate SHA-256 digest: //p' signature-info.txt | sort -u)"
          test "$VV_CERTIFICATES" = "55d9c2dc94f32e6b7685994f2652eec3d8086432e9de94e0645a8bf30f41918e"
          "$VF_BUILD_TOOLS/aapt" dump badging Visionflix_BV_TV.apk > apk-info.txt
          grep -F "package: name='com.br174.visionflix.tv.debug' versionCode='169' versionName='1.7.240'" apk-info.txt
          grep -F "application-label:'Verlezza Vision'" apk-info.txt
          grep -F "com.streamflixreborn.streamflix.activities.main.MainTvActivity" apk-info.txt
          grep -F "sdkVersion:'21'" apk-info.txt

      - name: Publish the APK for Downloader
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$RELEASE_TAG" --repo "$GH_REPO" --pattern Visionflix_BV_TV.apk --dir existing
            cmp Visionflix_BV_TV.apk existing/Visionflix_BV_TV.apk
            exit 0
          fi
          cat > release-notes.md <<'NOTES'
          Verlezza Vision per Android TV, versione 1.7.240 (versionCode 169).
          
          Codice Downloader: **3875230**. Scarica sempre l'asset Visionflix_BV_TV.apk della release Latest.
          
          Nome, logo e banner TV aggiornati a Verlezza Vision; incluse le modifiche alla ricerca TV, ai suggerimenti degli attori e al DNS già presenti nel progetto.
          
          Firma resa stabile selezionando esplicitamente la chiave conservata dal progetto. Le build precedenti usavano chiavi temporanee diverse: questo APK non può aggiornare direttamente quelle installazioni. Rimuovere la vecchia app può cancellarne i dati; salvare prima le impostazioni.
          
          Android minimo dichiarato: 5.0. Integrità, firma, nome e avvio TV verificati; installazione e funzionamento sulla TV restano da verificare.
          
          Sono pubblicati solo l'installer, il riepilogo tecnico e la somma di controllo. Il progetto Visionflix rimane privato.
          NOTES
          gh release create "$RELEASE_TAG" \
            Visionflix_BV_TV.apk SHA256SUMS.txt apk-info.txt signature-info.txt \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title 'Verlezza Vision TV — 1.7.240 (build 169)' \
            --notes-file release-notes.md --latest

