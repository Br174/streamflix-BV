name: Scudo360 r40 StreamBV native quality LAB
on:
  pull_request:
    branches:
      - motorlab/active-vision-delivery
permissions:
  contents: read
  actions: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Execute existing r39 suite only once
        run: node .motorlab/regression/scudo360-gate.mjs .motorlab/scudo360-contracts.json lab .motorlab/scudo360-r40-native.json
      - name: Retrieve immutable exact R39 baseline JUnit report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 40885038559 -n scudo360-streambv-pr-40885038559 -D /tmp/motorlab-r39-source-proof
          test -s /tmp/motorlab-r39-source-proof/scudo360-report.json
          cp /tmp/motorlab-r39-source-proof/scudo360-report.json .motorlab/scudo360-r39-baseline.json
          node - <<'NODE'
          const r=require('./.motorlab/scudo360-r39-baseline.json');
          if(r.commit!=='8478565be5327eaec97078da16af762cfb9133b6' || r.passed!==true)throw Error('SCUDO_R39_HISTORICAL_BASELINE_MISMATCH');
          console.log('SCUDO_R39_BASELINE_VERIFIED',r.commit);
          NODE
      - name: Audit every native P0 P1 request on exact source commit
        run: node .motorlab/regression/scudo360-quality-r40.mjs .motorlab/scudo360-contracts.json .motorlab/scudo360-r40-native.json .motorlab/scudo360-r40-plan.json .motorlab/scudo360-r40-quality.json
      - name: Publish evidence including failed native contracts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scudo-r40-streambv-evidence
          path: |
            .motorlab/scudo360-r40-native.json
            .motorlab/scudo360-r40-quality.json
          if-no-files-found: warn
